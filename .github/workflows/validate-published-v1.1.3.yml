name: Verify published turbotokens integration

on:
  push:
    branches: [validation/published-v1.1.3]

permissions:
  contents: read

jobs:
  contracts:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            archive: turbotokens-linux-x64.tar.gz
            sha256: 3e024cbbd916e037d5073149a92843960e2871ab8a5d5270ce90d593235f25a3
            binary_sha256: d0825e2a10aa5a0dec17bcd1126c247d42fa37fa80e466739026af9a822f687c
          - os: ubuntu-24.04-arm
            archive: turbotokens-linux-arm64.tar.gz
            sha256: 7256ba213586a8a37512b3dee112a63c868accd4af9166883ced8c74f4b924fe
            binary_sha256: 10a8f04e9f1863e5754821b9c02daba129ca66ceac79717932cb4d064c9620e0
          - os: macos-15
            archive: turbotokens-macos-arm64.tar.gz
            sha256: e0ebdb307c70edb437ea23e98c2579b6747eefe03726174ce11f69f779768659
            binary_sha256: 77a43ff678097232e8868e1f9d92f8d3b602ee511cd0dc4c2d21ef36828f86bd
          - os: macos-15-intel
            archive: turbotokens-macos-x64.tar.gz
            sha256: 517cd526ee149e00e1ca6d29069cac0414e868f3202070b11c1717c619bbc811
            binary_sha256: 19b962ae4d7649d90003473eafcc4c79d8792e6fd28ae80d23c5e3f27b1e1425
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e460c06254a422a1f90eb0b0fb15085073cdd3dc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - name: Download and verify published v1.1.3
        env:
          ARCHIVE: ${{ matrix.archive }}
          ARCHIVE_SHA256: ${{ matrix.sha256 }}
          BINARY_SHA256: ${{ matrix.binary_sha256 }}
          APP_SOURCE: e460c06254a422a1f90eb0b0fb15085073cdd3dc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" "$RUNNER_TEMP/proof"
          curl --proto '=https' --proto-redir '=https' -fsSL "https://github.com/maxmoneycash/turbotokens/releases/download/v1.1.3/$ARCHIVE" -o "$RUNNER_TEMP/native/$ARCHIVE"
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          archive_path = root / "native" / os.environ["ARCHIVE"]
          archive = archive_path.read_bytes()
          digest = hashlib.sha256(archive).hexdigest()
          assert digest == os.environ["ARCHIVE_SHA256"], "release archive checksum differs"
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              members = bundle.getmembers()
              assert len(members) == 3 and {member.name for member in members} == {"turbotokens", "README.md", "LICENSE"}
              assert all(member.isfile() for member in members)
              binary = bundle.extractfile("turbotokens").read()
          assert hashlib.sha256(binary).hexdigest() == os.environ["BINARY_SHA256"]
          executable = root / "native" / "turbotokens"
          executable.write_bytes(binary)
          executable.chmod(0o755)
          actual_source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual_source == os.environ["APP_SOURCE"]
          (root / "proof" / "binary.json").write_text(json.dumps({
              "release": "v1.1.3",
              "release_source": "27ceda8944e85429ddd8e62e650c7994459a9568",
              "application_source": actual_source,
              "archive": os.environ["ARCHIVE"],
              "archive_sha256": digest,
              "binary_sha256": hashlib.sha256(binary).hexdigest()
          }, indent=2) + "\n")
          PY
          test "$("$RUNNER_TEMP/native/turbotokens" --version)" = 'turbotokens 1.1.3'
      - name: Install the published comparison collector
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/ccusage" ccusage@20.0.20
      - name: Verify published release contracts
        env:
          TOKEN_HISTORY_TEST_TURBOTOKENS: ${{ runner.temp }}/native/turbotokens
          TOKEN_HISTORY_TEST_CCUSAGE: ${{ runner.temp }}/ccusage/node_modules/.bin/ccusage
        run: |
          python --version
          node --version
          "$RUNNER_TEMP/native/turbotokens" --version
          "$RUNNER_TEMP/ccusage/node_modules/.bin/ccusage" --version
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/proof/tests.log"
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-contracts-${{ matrix.os }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: warn
