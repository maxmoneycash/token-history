name: Validate collector path fix

on:
  pull_request:
    branches: [feat/installed-usage-collector]

permissions:
  contents: read

jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-15-intel
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - name: Standard library tests
        run: python -m unittest discover -s tests -v
      - name: Install pinned collectors in a temporary directory
        run: npm install --prefix "$RUNNER_TEMP/collector-bin" turbotokens@1.1.2 ccusage@20.0.20
      - name: Installed collector comparisons
        env:
          TOKEN_HISTORY_TEST_TURBOTOKENS: ${{ runner.temp }}/collector-bin/node_modules/.bin/turbotokens
          TOKEN_HISTORY_TEST_CCUSAGE: ${{ runner.temp }}/collector-bin/node_modules/.bin/ccusage
        run: python -m unittest discover -s tests -v
